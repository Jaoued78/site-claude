<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DB Search</title>
<style>
  :root{--bg:#0d0d0d;--surface:#161616;--border:#2a2a2a;--accent:#e8ff00;--text:#e0e0e0;--muted:#555;--danger:#ff4444;--ok:#44ff88}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:'JetBrains Mono','Fira Code',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:2rem 1rem}
  header{width:100%;max-width:980px;margin-bottom:1.5rem;border-bottom:1px solid var(--border);padding-bottom:1rem;display:flex;justify-content:space-between;align-items:flex-end}
  h1{font-size:1.4rem;color:var(--accent);letter-spacing:.1em}
  .sub{color:var(--muted);font-size:.72rem;margin-top:.3rem}

  .panel{width:100%;max-width:980px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.9rem 1rem;margin-bottom:1rem}
  .panel-title{font-size:.75rem;color:var(--accent);margin-bottom:.7rem;letter-spacing:.08em;display:flex;justify-content:space-between;align-items:center}
  .panel-title span{color:var(--muted);font-size:.68rem;font-weight:normal}
  .table-grid{display:flex;flex-wrap:wrap;gap:.4rem}
  .t-chip{background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:.3rem .8rem;font-size:.75rem;color:var(--muted);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:.35rem;font-family:inherit}
  .t-chip:hover{border-color:var(--accent);color:var(--text)}
  .t-chip.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
  .t-chip .cnt{font-size:.62rem;opacity:.7}
  .no-tables{color:var(--muted);font-size:.78rem;padding:.5rem 0}

  .upload-zone{width:100%;max-width:980px;border:2px dashed var(--border);border-radius:8px;padding:1.4rem;text-align:center;color:var(--muted);font-size:.82rem;margin-bottom:1rem;cursor:pointer;transition:border-color .2s,color .2s;line-height:1.7}
  .upload-zone:hover,.upload-zone.over{border-color:var(--accent);color:var(--accent)}
  #fileInput{display:none}
  .up-progress{width:100%;height:3px;appearance:none;border:none;background:var(--border);border-radius:2px;margin-top:.6rem;display:none}
  .up-progress::-webkit-progress-bar{background:var(--border)}
  .up-progress::-webkit-progress-value{background:var(--accent)}

  .search-bar{width:100%;max-width:980px;display:flex;gap:.5rem;margin-bottom:.8rem}
  .search-bar input{flex:1;background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.75rem 1rem;font-family:inherit;font-size:.95rem;outline:none;border-radius:4px;transition:border-color .2s}
  .search-bar input:focus{border-color:var(--accent)}
  .search-bar input::placeholder{color:var(--muted)}
  button.go{background:var(--accent);color:#000;border:none;padding:.75rem 1.5rem;font-family:inherit;font-size:.88rem;font-weight:700;cursor:pointer;border-radius:4px;white-space:nowrap}
  button.go:hover{opacity:.88}
  button.go:disabled{opacity:.35;cursor:not-allowed}

  .r-header{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;margin-bottom:.6rem}
  .r-count{font-size:.78rem;color:var(--muted)}
  .exp-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:.28rem .7rem;font-size:.7rem;border-radius:4px;cursor:pointer;font-family:inherit}
  .exp-btn:hover{border-color:var(--accent);color:var(--accent)}

  .results{width:100%;max-width:980px;display:flex;flex-direction:column;gap:.5rem}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:.85rem 1rem;transition:border-color .15s}
  .card:hover{border-color:var(--accent)}
  .card-meta{display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);margin-bottom:.55rem}
  .card-src{color:var(--accent)}
  .card-fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:.4rem .9rem}
  .fp{display:flex;flex-direction:column}
  .fk{font-size:.63rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .fv{font-size:.84rem;color:var(--text);word-break:break-all;display:flex;align-items:center;gap:.2rem}
  .fv.hl{color:var(--accent);font-weight:700}
  .fv span{flex:1}
  .cp{background:none;border:none;color:var(--muted);cursor:pointer;font-size:.6rem;padding:0;flex-shrink:0}
  .cp:hover{color:var(--accent)}

  .pag{width:100%;max-width:980px;display:flex;justify-content:center;gap:.4rem;margin-top:1rem;flex-wrap:wrap}
  .pb{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.28rem .62rem;font-size:.75rem;border-radius:4px;cursor:pointer;font-family:inherit}
  .pb.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}
  .pb:disabled{opacity:.3;cursor:not-allowed}

  .empty{text-align:center;color:var(--muted);padding:2.5rem;font-size:.82rem}
  .status-bar{width:100%;max-width:980px;margin-top:1rem;font-size:.68rem;color:var(--muted);border-top:1px solid var(--border);padding-top:.6rem;display:flex;justify-content:space-between}
  .spinner{display:inline-block;width:10px;height:10px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:.3rem}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--accent);color:#000;padding:.5rem 1rem;border-radius:4px;font-size:.76rem;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:999}
  .toast.show{opacity:1}
  .toast.err{background:var(--danger);color:#fff}
</style>
</head>
<body>

<header>
  <div>
    <h1>⚡ DB SEARCH</h1>
    <div class="sub">recherche locale · aucune donnée envoyée en ligne</div>
  </div>
  <div style="text-align:right;font-size:.68rem;color:var(--muted)" id="memInfo"></div>
</header>

<div class="panel">
  <div class="panel-title">
    FICHIERS CHARGÉS
    <span id="totalCount"></span>
  </div>
  <div class="table-grid" id="tableGrid">
    <div class="no-tables">aucun fichier — charge un CSV ou TXT ci-dessous.</div>
  </div>
</div>

<div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
  📂 charge tes fichiers (CSV, TXT, JSON, JSONL) — glisse ici ou clique<br>
  <span style="font-size:.7rem;opacity:.6">tout reste dans ton navigateur, rien n'est envoyé</span>
  <progress class="up-progress" id="upProg" value="0" max="100"></progress>
</div>
<input type="file" id="fileInput" multiple accept=".csv,.json,.jsonl,.txt">

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="email, nom, IP, discord ID..." autocomplete="off">
  <button class="go" id="goBtn" onclick="doSearch(0)">SEARCH</button>
</div>

<div class="r-header" id="rHeader" style="display:none">
  <span class="r-count" id="rCount"></span>
  <button class="exp-btn" onclick="exportJSON()">↓ EXPORT JSON</button>
</div>

<div class="results" id="results">
  <div class="empty">charge un fichier et tape une recherche.</div>
</div>
<div class="pag" id="pag"></div>

<div class="status-bar">
  <span id="stLeft">prêt.</span>
  <span id="stRight"></span>
</div>
<div class="toast" id="toast"></div>

<script>
// ── state ─────────────────────────────────────────────────────────────────────
const DB = [];   // [{name, rows: [{...}]}]
const S  = { query: "", page: 0, size: 25, total: 0, allResults: [], results: [] };

// ── upload ────────────────────────────────────────────────────────────────────
const dz = document.getElementById("dropZone");
const fi = document.getElementById("fileInput");
dz.addEventListener("dragover", e => { e.preventDefault(); dz.classList.add("over"); });
dz.addEventListener("dragleave", () => dz.classList.remove("over"));
dz.addEventListener("drop", e => { e.preventDefault(); dz.classList.remove("over"); handleFiles([...e.dataTransfer.files]); });
fi.addEventListener("change", () => { handleFiles([...fi.files]); fi.value = ""; });

async function handleFiles(files) {
  const prog = document.getElementById("upProg");
  prog.style.display = "block"; prog.value = 0;

  for (let fi = 0; fi < files.length; fi++) {
    const file = files[fi];
    document.getElementById("stLeft").textContent = `lecture ${file.name}…`;
    try {
      const rows = await parseFile(file);
      if (!rows.length) { showToast(`${file.name}: vide ou non parsable`, true); continue; }
      // remplace si déjà chargé
      const existing = DB.findIndex(d => d.name === file.name);
      if (existing >= 0) DB[existing] = { name: file.name, rows };
      else DB.push({ name: file.name, rows });
      showToast(`✓ ${file.name} — ${rows.length.toLocaleString()} lignes`);
    } catch(e) {
      showToast(`erreur ${file.name}: ${e.message}`, true);
    }
    prog.value = Math.round(((fi + 1) / files.length) * 100);
  }

  prog.value = 100;
  setTimeout(() => { prog.style.display = "none"; prog.value = 0; }, 600);
  document.getElementById("stLeft").textContent = "prêt.";
  renderTableGrid();
}

// ── parsers ───────────────────────────────────────────────────────────────────
async function parseFile(file) {
  const text = await readFileAsText(file);
  const ext  = file.name.split(".").pop().toLowerCase();

  if (ext === "json") {
    const p = JSON.parse(text);
    return Array.isArray(p) ? p : (p.data || p.rows || p.results || [p]);
  }
  if (ext === "jsonl") {
    return text.trim().split("\n").map(l => { try { return JSON.parse(l); } catch { return null; } }).filter(Boolean);
  }
  // CSV / TXT
  return parseTextFile(text);
}

function parseTextFile(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (!lines.length) return [];

  // détecte format "Key: value - Key: value"
  if (isKVFormat(lines[0])) {
    return lines.map(parseKVLine).filter(Boolean);
  }

  // CSV classique (virgule, point-virgule ou tab)
  const headers = splitCSV(lines[0]);
  return lines.slice(1).map(line => {
    const vals = splitCSV(line);
    const obj  = {};
    headers.forEach((h, i) => { obj[h.trim()] = (vals[i] ?? "").trim(); });
    return obj;
  }).filter(r => Object.values(r).some(v => v));
}

function isKVFormat(line) {
  return /^\s*\w[\w ]*:\s*.+\s+-\s+\w[\w ]*:/.test(line);
}

function parseKVLine(line) {
  const obj   = {};
  const parts = line.split(/ - (?=[\w][\w ]*: )/);
  for (const part of parts) {
    const idx = part.indexOf(": ");
    if (idx === -1) continue;
    obj[part.slice(0, idx).trim()] = part.slice(idx + 2).trim();
  }
  return Object.keys(obj).length ? obj : null;
}

function splitCSV(line) {
  const res = []; let cur = "", inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"' && !inQ)  { inQ = true; continue; }
    if (c === '"' && inQ)   { if (line[i+1] === '"') { cur += '"'; i++; } else { inQ = false; } continue; }
    if ((c === ',' || c === ';' || c === '\t') && !inQ) { res.push(cur); cur = ""; continue; }
    cur += c;
  }
  res.push(cur); return res;
}

function readFileAsText(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload  = () => res(fr.result);
    fr.onerror = () => rej(new Error("impossible de lire le fichier"));
    fr.readAsText(file, "utf-8");
  });
}

// ── render fichiers ───────────────────────────────────────────────────────────
function renderTableGrid() {
  const grid = document.getElementById("tableGrid");
  if (!DB.length) {
    grid.innerHTML = '<div class="no-tables">aucun fichier chargé.</div>';
    document.getElementById("totalCount").textContent = "";
    document.getElementById("stRight").textContent = "";
    return;
  }
  grid.innerHTML = DB.map((d, i) => `
    <div class="t-chip active" onclick="removeDB(${i})" title="clic pour retirer">
      ${esc(d.name)} <span class="cnt">${d.rows.length.toLocaleString()} ✕</span>
    </div>`).join("");
  const total = DB.reduce((a, d) => a + d.rows.length, 0);
  document.getElementById("totalCount").textContent =
    `${DB.length} fichier${DB.length > 1 ? "s" : ""} · ${total.toLocaleString()} lignes`;
  document.getElementById("stRight").textContent = `${total.toLocaleString()} lignes en mémoire`;
  // estimation RAM (JSON.stringify ~= bytes)
  try {
    const mb = (JSON.stringify(DB).length / 1e6).toFixed(1);
    document.getElementById("memInfo").textContent = `~${mb} Mo en RAM`;
  } catch {}
}

function removeDB(i) {
  DB.splice(i, 1);
  renderTableGrid();
  if (S.query) doSearch(0);
}

// ── search ─────────────────────────────────────────────────────────────────────
document.getElementById("searchInput").addEventListener("keydown", e => { if (e.key === "Enter") doSearch(0); });

function doSearch(p = 0) {
  const q = document.getElementById("searchInput").value.trim();
  S.query = q; S.page = p;
  if (!q || !DB.length) { renderResults(); return; }

  document.getElementById("stLeft").innerHTML = '<span class="spinner"></span>recherche...';
  document.getElementById("goBtn").disabled = true;

  // micro-délai pour laisser le spinner s'afficher
  setTimeout(() => {
    try {
      const terms = q.toLowerCase().split(/\s+/);
      S.allResults = [];

      for (const db of DB) {
        for (const row of db.rows) {
          const values = Object.values(row).map(v => String(v ?? "").toLowerCase());
          if (terms.every(t => values.some(v => v.includes(t)))) {
            S.allResults.push({ _src: db.name, ...row });
          }
        }
      }

      S.total   = S.allResults.length;
      S.results = S.allResults.slice(p * S.size, (p + 1) * S.size);
      renderResults();
      document.getElementById("stLeft").textContent = `"${q}" — ${S.total.toLocaleString()} résultat(s)`;
    } catch(e) {
      document.getElementById("stLeft").textContent = "erreur: " + e.message;
    }
    document.getElementById("goBtn").disabled = false;
  }, 10);
}

// ── render résultats ───────────────────────────────────────────────────────────
function renderResults() {
  const box = document.getElementById("results");
  const hdr = document.getElementById("rHeader");
  if (!S.query) {
    box.innerHTML = '<div class="empty">charge un fichier et tape une recherche.</div>';
    hdr.style.display = "none"; renderPag(); return;
  }
  hdr.style.display = "flex";
  document.getElementById("rCount").textContent = `${S.total.toLocaleString()} résultat${S.total !== 1 ? "s" : ""}`;
  if (!S.results.length) { box.innerHTML = '<div class="empty">aucun résultat.</div>'; renderPag(); return; }
  const terms = S.query.toLowerCase().split(/\s+/);
  box.innerHTML = S.results.map(row => renderCard(row, terms)).join("");
  renderPag();
}

function renderCard(row, terms) {
  const fields = Object.entries(row).filter(([k]) => k !== "_src");
  const pairs = fields.map(([k, v]) => {
    const vs  = String(v ?? "");
    const hl  = terms.some(t => vs.toLowerCase().includes(t));
    return `<div class="fp">
      <span class="fk">${esc(k)}</span>
      <div class="fv ${hl ? "hl" : ""}">
        <span>${esc(trunc(vs, 85))}</span>
        <button class="cp" onclick="cpv('${vs.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')" title="copier">⎘</button>
      </div>
    </div>`;
  }).join("");
  return `<div class="card">
    <div class="card-meta"><span class="card-src">📁 ${esc(row._src)}</span></div>
    <div class="card-fields">${pairs}</div>
  </div>`;
}

function renderPag() {
  const pages = Math.ceil(S.total / S.size);
  const el    = document.getElementById("pag");
  if (pages <= 1) { el.innerHTML = ""; return; }
  let h = `<button class="pb" onclick="doSearch(${S.page - 1})" ${S.page === 0 ? "disabled" : ""}>←</button>`;
  for (let i = 0; i < pages; i++) {
    if (pages > 10 && Math.abs(i - S.page) > 2 && i !== 0 && i !== pages - 1) {
      if (i === 1 || i === pages - 2) h += '<span style="color:var(--muted);padding:0 .3rem">…</span>';
      continue;
    }
    h += `<button class="pb ${i === S.page ? "active" : ""}" onclick="doSearch(${i})">${i + 1}</button>`;
  }
  h += `<button class="pb" onclick="doSearch(${S.page + 1})" ${S.page >= pages - 1 ? "disabled" : ""}>→</button>`;
  el.innerHTML = h;
}

// ── export ────────────────────────────────────────────────────────────────────
function exportJSON() {
  const blob = new Blob([JSON.stringify(S.allResults, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = `export_${Date.now()}.json`; a.click();
}

// ── utils ─────────────────────────────────────────────────────────────────────
function cpv(v) { navigator.clipboard.writeText(v).then(() => showToast("copié !")).catch(() => showToast("erreur copie", true)); }
function showToast(m, err = false) {
  const t = document.getElementById("toast");
  t.textContent = m; t.className = "toast" + (err ? " err" : "") + " show";
  setTimeout(() => t.className = "toast", 2600);
}
function esc(s)    { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function trunc(s,n){ return s.length > n ? s.slice(0, n) + "…" : s; }
</script>
</body>
</html>
